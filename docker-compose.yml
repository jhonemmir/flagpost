name: flagpost

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagpost
      POSTGRES_USER: flagpost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagpost -d flagpost"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: flagpost
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?run scripts/dev-env.sh first}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: flagpost
      DB_USERNAME: flagpost
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh first}
      FLAGPOST_ADMIN_KEY: ${FLAGPOST_ADMIN_KEY:?run scripts/dev-env.sh first}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db-data:
