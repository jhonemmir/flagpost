name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Shared vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate evaluation.json
        run: python3 scripts/check_vectors.py

  php:
    name: PHP (Laravel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flagpost_test
          POSTGRES_USER: flagpost
          POSTGRES_PASSWORD: flagpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagpost -d flagpost_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Install dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check style
        working-directory: api
        run: ./vendor/bin/pint --test
      - name: Static analysis
        working-directory: api
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Tests (SQLite)
        working-directory: api
        run: ./vendor/bin/pest
      - name: Tests (PostgreSQL)
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: flagpost_test
          DB_USERNAME: flagpost
          DB_PASSWORD: flagpost
        run: |
          php artisan migrate --force
          ./vendor/bin/pest

  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (net8.0 and net10.0)
        run: dotnet build sdk-dotnet/Flagpost.sln -c Release --nologo
      - name: Tests (net10.0)
        run: dotnet test sdk-dotnet/Flagpost.sln -c Release --no-build --framework net10.0 --nologo --collect:"XPlat Code Coverage" --results-directory TestResults/net10.0
      - name: Tests (net8.0)
        run: dotnet test sdk-dotnet/Flagpost.sln -c Release --no-build --framework net8.0 --nologo --collect:"XPlat Code Coverage" --results-directory TestResults/net8.0
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-coverage-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
