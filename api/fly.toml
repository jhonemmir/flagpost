# Fly.io deployment for the Flagpost API.
#
# Deploy from this directory with one Machine (recommended for the free plan):
#   fly deploy --ha=false
#
# Secrets (never commit them):
#   fly secrets set APP_KEY="base64:..." \
#     FLAGPOST_ADMIN_KEY="..." \
#     DB_URL="postgresql://user:pass@host/db?sslmode=require"
#
# The release command runs once per deploy, before any Machine takes traffic.
# It is deliberately not part of the container command.

app = "flagpost-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "php artisan migrate --force"

[env]
  APP_NAME = "flagpost"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://flagpost-api.fly.dev"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  DB_CONNECTION = "pgsql"
  SESSION_DRIVER = "array"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "sync"
  TRUSTED_PROXIES = "*"
  PHP_CLI_SERVER_WORKERS = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/up"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
